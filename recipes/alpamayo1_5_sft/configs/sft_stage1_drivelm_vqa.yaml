defaults:
  - sft_base
  - /models/ar1_5_base@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.drivelm_vqa.DriveLMVQADataset
    _recursive_: false
    data_root: ${oc.env:DRIVELM_VQA_ROOT,/mnt/nvme/drivelm_vqa_t4}
    split: train
    sources: ["perception_vqa", "driving_context_vqa"]
    categories: ["perception", "prediction", "planning"]
    val_ratio: 0.1
    seed: 42
    sampling_mode: balanced_epoch
    epoch_size: 50000
    perception_image_mode: labeled_first
    index_cache_path: /mnt/nvme/alpamayo_outputs/drivelm_vqa_index/train.jsonl
    local_dir: null
    chunk_ids: null
    use_default_keyframe: null
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.drivelm_vqa.DriveLMVQADataset
    _recursive_: false
    data_root: ${oc.env:DRIVELM_VQA_ROOT,/mnt/nvme/drivelm_vqa_t4}
    split: val
    sources: ["perception_vqa", "driving_context_vqa"]
    categories: ["perception", "prediction", "planning"]
    val_ratio: 0.1
    seed: 42
    sampling_mode: fixed
    epoch_size: null
    perception_image_mode: labeled_first
    index_cache_path: /mnt/nvme/alpamayo_outputs/drivelm_vqa_index/val.jsonl
    local_dir: null
    chunk_ids: null
    use_default_keyframe: null
    vla_preprocess_args:
      generation_mode: true

callbacks:
  drivelm_epoch_sampler:
    _target_: alpamayo1_5_sft.callbacks.DriveLMEpochSamplerCallback

trainer:
  ddp_find_unused_parameters: false
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  dataloader_num_workers: 8
  dataloader_persistent_workers: true
  learning_rate: 1e-5
  warmup_steps: 500
  max_steps: -1
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 3

paths:
  output_dir: output_stage1_drivelm_vqa
evaluate:
  eval_ckpt: null
task_name: alpamayo_r1_5_sft_stage1_drivelm_vqa
